<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Mobile — search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
</head>
<body>
<style>
body{margin:0}
a{color:#18181b}a:hover{color:#52525b}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #18181b; font-family: Geist, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<main style="flex: 1; overflow: hidden; padding: 20px 16px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">

<div style="background: #fafafa; border: 1px solid #e4e4e7; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; font-weight: 500; color: #52525b">Answer</div>
<div>You last saw Anna on <strong style="font-weight: 600">Thursday 1 Oct</strong> at Café Pascal. Before that, 14 Sep at her birthday party.</div>
<div style="font-size: 12px; color: #52525b">From 2 notes</div>
</div>

<div style="font-size: 12px; font-weight: 500; color: #52525b; padding: 6px 4px 0">People</div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 4px; text-decoration: none; color: #18181b">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #dbeafe; color: #1d4ed8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">AB</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">Anna Berg</span><span style="font-size: 13px; color: #52525b">Friend · 12 notes</span></span>
</a>

<div style="font-size: 12px; font-weight: 500; color: #52525b; padding: 6px 4px 0">Notes</div>
<a href="#" style="display: flex; flex-direction: column; padding: 8px 4px; text-decoration: none; color: #18181b">
<span style="font-weight: 500">Fika with Anna</span>
<span style="font-size: 13px; color: #52525b">Thu 1 Oct · Café Pascal</span>
</a>
<a href="#" style="display: flex; flex-direction: column; padding: 8px 4px; text-decoration: none; color: #18181b">
<span style="font-weight: 500">Anna's 35th</span>
<span style="font-size: 13px; color: #52525b">Sun 14 Sep · Hornstull</span>
</a>
</main>

<footer style="padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #f4f4f5">
<div style="display: flex; gap: 6px; overflow: hidden">
<button style="height: 36px; padding: 0 14px; border: 0; background: #18181b; color: #ffffff; border-radius: 999px; font: inherit; font-size: 13px">All</button>
<button style="height: 36px; padding: 0 14px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 999px; font: inherit; font-size: 13px">People</button>
<button style="height: 36px; padding: 0 14px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 999px; font: inherit; font-size: 13px">Places</button>
<button style="height: 36px; padding: 0 14px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 999px; font: inherit; font-size: 13px">Events</button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #f4f4f5; border-radius: 26px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="s-q" style="position: absolute; left: -9999px">Search your wiki</label>
<input id="s-q" value="When did I last see Anna?" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #18181b">
</div>
<button aria-label="Ask by voice" style="width: 52px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; background: #18181b; border-radius: 50%; color: #ffffff">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
</footer>

</div>


</body></html>
