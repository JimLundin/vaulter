<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Mobile — clarify after recording</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
</head>
<body>
<style>
body{margin:0}
a{color:#18181b}a:hover{color:#52525b}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(24,24,27,0.45); color: #18181b; font-family: Geist, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<section aria-label="Clarify" style="background: #ffffff; border-radius: 24px 24px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #d4d4d8"></div>

<div style="padding: 0 4px">
<div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">2 quick questions</div>
<div style="font-size: 13px; color: #52525b">Note saved · Pip will update the wiki once you answer</div>
</div>

<div style="border: 1px solid #e4e4e7; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 11px; font-weight: 600; color: #9a3412; letter-spacing: 0.02em">DOESN'T MATCH</div>
<div>You said Anna starts at Spotify in <strong style="font-weight: 600">November</strong>. On 26 Aug you said <strong style="font-weight: 600">December</strong>.</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border: 1px solid #18181b; background: #18181b; color: #ffffff; border-radius: 12px; font: inherit; font-size: 14px">November</button>
<button style="height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 12px; font: inherit; font-size: 14px">December</button>
<button style="height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 12px; font: inherit; font-size: 14px">Not sure</button>
</div>
</div>

<div style="border: 1px solid #e4e4e7; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 11px; font-weight: 600; color: #1d4ed8; letter-spacing: 0.02em">WHO'S WHO</div>
<div>Is Anna's brother <strong style="font-weight: 600">Jonas</strong> the Jonas you met at Erik's party in May?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 12px; font: inherit; font-size: 14px">Same person</button>
<button style="height: 44px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 12px; font: inherit; font-size: 14px">Someone else</button>
</div>
</div>

<div style="font-size: 13px; color: #52525b; padding: 0 4px">Also understood: “the usual place” → Café Pascal</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 4px">
<button style="height: 52px; border: 1px solid #e4e4e7; background: #ffffff; color: #18181b; border-radius: 14px; font: inherit; font-size: 14px">Later</button>
<button aria-label="Answer by voice" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #e4e4e7; background: #ffffff; border-radius: 50%; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button style="height: 52px; border: 0; background: #18181b; color: #ffffff; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 500">Done</button>
</div>
</section>

</div>


</body></html>
