<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Mobile — recording, Pip asks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
</head>
<body>
<style>
body{margin:0}
a{color:#18181b}a:hover{color:#52525b}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #18181b; font-family: Geist, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<div style="padding: 28px 20px 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #b91c1c">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #dc2626"></span>
Recording · 0:23
</div>

<main style="flex: 1; overflow: hidden; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end">
<div style="font-size: 22px; line-height: 1.45; font-weight: 500; letter-spacing: -0.01em">
Had fika with <span style="background: #ffedd5; border-radius: 4px; padding: 0 3px">Anna</span> at the usual place. She's starting at <span style="text-decoration: underline; text-decoration-color: #a1a1aa; text-decoration-thickness: 2px; text-underline-offset: 4px">Spotify</span> in November, and her brother <span style="text-decoration: underline; text-decoration-color: #3b82f6; text-decoration-thickness: 2px; text-underline-offset: 4px">Jonas</span> is moving to <span style="color: #a1a1aa">Gothenburg…</span>
</div>
</main>

<section style="background: #fafafa; border-top: 1px solid #e4e4e7; border-radius: 24px 24px 0 0; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 22px; height: 22px; border-radius: 6px; background: #18181b; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">P</span>
<span style="font-weight: 500">Which Anna?</span>
<span style="margin-left: auto; font-size: 12px; color: #52525b">or just say it</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button style="height: 40px; padding: 0 14px; border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500">Anna Berg</button>
<button style="height: 40px; padding: 0 14px; border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500">Anna Lindqvist</button>
<button style="height: 40px; padding: 0 14px; border: 1px dashed #a1a1aa; background: #ffffff; color: #3f3f46; border-radius: 999px; font: inherit; font-size: 14px">Someone new</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end">
<button style="justify-self: start; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; font: inherit; font-size: 12px; color: #3f3f46; padding: 0">
<span style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 50%; color: #18181b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span>
Discard
</button>
<button style="justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; font: inherit; font-size: 12px; color: #3f3f46; padding: 0">
<span style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; background: #18181b; border-radius: 50%; color: #ffffff; box-shadow: 0 6px 16px rgba(24,24,27,0.22)"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></span>
Done
</button>
<button style="justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; font: inherit; font-size: 12px; color: #3f3f46; padding: 0">
<span style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 50%; color: #18181b"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></span>
Pause
</button>
</div>
</section>

</div>


</body></html>
