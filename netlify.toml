[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Public endpoint: keep this aligned with the GitHub VAULT_OPENAI_API variable.
  VITE_OPENAI_API = "https://fcg.palantirfoundry.com/language-model-service/api/proxy/openai/v1"

# GitHub Pages publishes the password-encrypted secrets. Proxy that public file
# through this origin so previews use the same password without build credentials.
# A deployment's own secrets.json takes precedence when present.
[[redirects]]
  from = "/secrets.json"
  to = "https://jimlundin.github.io/vaulter/secrets.json"
  status = 200

