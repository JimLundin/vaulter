# CI: on every push the tests, the type check and lint; on main, build the kernel bundle and deploy it to
# GitHub Pages (Settings → Pages → Source: GitHub Actions). Extensions aren't built here: the app reads
# them from the repo at runtime. Nothing secret is in the build; each device holds its own (safe mode).
name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - name: Build
        env:
          VITE_PIP_SOURCE: ${{ vars.PIP_SOURCE }}
        run: |
          npm ci && npm run build
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
