# CI: on every push the tests, the type check and lint; on main, build the page and deploy it to GitHub
# Pages (Settings → Pages → Source: GitHub Actions). The page carries main's extensions as source, which
# the browser compiles; drafts come from the repo at runtime. Secrets are sealed into dist/secrets.json with VAULTER_PASSWORD; each device
# opens them once and keeps its own copy.
name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - name: Build
        env:
          VITE_VAULTER_SOURCE: ${{ vars.VAULTER_SOURCE }}
          VITE_VAULTER_COMMIT: ${{ github.sha }}
        run: |
          npm ci && npm run build
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      # A step of its own, after the install: no dependency's script runs with the secrets around.
      - name: Seal the secrets in
        env:
          # The password, the salt, and each secret to seal, as VAULTER_SECRET__<EXTENSION>__<NAME>: a new
          # one is a line here and a secret of that name in the repo's settings.
          VAULTER_PASSWORD: ${{ secrets.VAULTER_PASSWORD }}
          VAULTER_SALT: ${{ vars.VAULTER_SALT }}
          VAULTER_SECRET__OPENAI__KEY: ${{ secrets.VAULTER_SECRET__OPENAI__KEY }}
          VAULTER_SECRET__SOURCE_GITHUB__TOKEN: ${{ secrets.VAULTER_SECRET__SOURCE_GITHUB__TOKEN }}
        run: node tools/seal-secrets.ts dist/secrets.json
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
