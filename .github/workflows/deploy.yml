# The app's CI: on every push the tests, the type check and lint; on main, build, seal the secrets in, and
# deploy to GitHub Pages. Other branches refresh their own sample design preview
# alongside the preserved production artifact immediately, while tests run independently.
# Production deployment remains gated by tests. Run by hand to refresh a preview or secrets.
name: Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      full_ui_matrix:
        description: Run every browser scenario on all three device profiles
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  framework-prototypes:
    name: Framework prototype compilers and static builds
    if: github.ref == 'refs/heads/prototype/sveltekit-solidstart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm ci --prefix prototypes/framework-migration/sveltekit
      - run: npm ci --prefix prototypes/framework-migration/solidstart
      - run: npm --prefix prototypes/framework-migration/sveltekit run check
      - run: npm --prefix prototypes/framework-migration/solidstart run check
      - run: npm --prefix prototypes/framework-migration/sveltekit run build
      - run: npm --prefix prototypes/framework-migration/solidstart run build
      - uses: actions/upload-artifact@v4
        with:
          name: framework-migration-prototypes
          path: |
            prototypes/framework-migration/sveltekit/build/
            prototypes/framework-migration/solidstart/dist/client/
          retention-days: 7

  behavior:
    name: Behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:fast

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:architecture

  browser:
    name: Browser ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    env:
      VAULTER_UI_MATRIX: ${{ inputs.full_ui_matrix && 'full' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install browser for UI checks
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          retention-days: 7

  production:
    name: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install browser for production checks
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-failures
          path: |
            playwright-report/
            test-results-production/
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [static, behavior, architecture, browser, production]
    if: ${{ always() }}
    steps:
      - name: Require every check and browser shard
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); process.exit(Object.values(jobs).every(job => job.result === "success") ? 0 : 1)'

  deploy:
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    needs: test
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - name: Build
        env:
          VITE_OPENAI_API: ${{ vars.VAULT_OPENAI_API }}
          VITE_VAULT_REPO: ${{ vars.VAULT_REPO }}
        run: npm ci && npm run build
      - name: Seal the secrets into it
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          VAULT_GITHUB_TOKEN: ${{ secrets.VAULT_GITHUB_TOKEN }}
          VAULT_OPENAI_KEY: ${{ secrets.VAULT_OPENAI_KEY }}
          VAULT_SALT: ${{ vars.VAULT_SALT }}
        run: |
          node tools/build/seal-secrets.ts dist/secrets.json
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/version.json
      - name: Preserve retained branch previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/preview/preserve-previews.ts
      - uses: actions/upload-pages-artifact@v4
        # Preview deployments reuse this exact production artifact.
        with: { path: dist, retention-days: 90 }
      - id: deploy
        uses: actions/deploy-pages@v4

  design-preview:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.preview.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Build sample design preview and component kit
        env:
          VITE_PREVIEW_COMMIT: ${{ github.sha }}
        run: npm run build:design
      - name: Retain this branch's sample preview
        uses: actions/upload-artifact@v4
        with:
          name: design-preview
          path: dist-preview
          retention-days: 90
          if-no-files-found: error
      - name: Preserve production and add preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/preview/publish-design.ts
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist-pages }
      - uses: actions/deploy-pages@v4
